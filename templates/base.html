<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=UnifrakturMaguntia&display=swap">
  <link rel="stylesheet" href="{{ get_url(path='css/site.css', cachebust=true) }}">
  <script>
    // Inline so a saved theme applies before first paint. Without JS the site follows the OS.
    (() => {
      const html = document.documentElement;
      try { const t = localStorage.getItem("theme"); if (t) html.dataset.theme = t; } catch {}
      const dark = () => html.dataset.theme ? html.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      const label = (b) => { b.textContent = b.dataset[dark() ? "tLight" : "tDark"]; };
      addEventListener("DOMContentLoaded", () => {
        const b = document.querySelector("[data-theme-toggle]");
        label(b); b.hidden = false;
        b.previousElementSibling.hidden = false;
        b.addEventListener("click", () => {
          html.dataset.theme = dark() ? "light" : "dark";
          try { localStorage.setItem("theme", html.dataset.theme); } catch {}
          label(b);
        });
        matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => label(b));
      });
    })();
  </script>
  <script src="{{ get_url(path='js/edition.js', cachebust=true) }}" defer></script>
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path='atom.xml', lang=lang, trailing_slash=false) }}">
</head>
<body class="min-h-screen font-body text-ink antialiased">
  <header class="mx-auto max-w-6xl px-4 pt-6">
    <div class="flex flex-col items-center gap-1 border-b border-ink pb-2 sm:flex-row sm:justify-between">
      <p class="text-sm italic text-muted">{{ config.description }}</p>
      <nav class="smallcaps flex items-center gap-3 text-[15px] text-ink">
        <a href="{{ get_url(path='@/digest/_index.md', lang=lang) }}" class="hover:text-accent">{{ trans(key="archive", lang=lang) }}</a>
        <span class="text-faint">·</span>
        <a href="{{ get_url(path='atom.xml', lang=lang, trailing_slash=false) }}" class="hover:text-accent">{{ trans(key="feed", lang=lang) }}</a>
        <span class="text-faint" hidden>·</span>
        <button type="button" data-theme-toggle data-t-dark="{{ trans(key='theme_dark', lang=lang) }}" data-t-light="{{ trans(key='theme_light', lang=lang) }}" class="cursor-pointer lowercase hover:text-accent" hidden></button>
      </nav>
    </div>
    <a href="{{ get_url(path='/', lang=lang) }}" class="block py-3 text-center font-display text-[clamp(3.25rem,11vw,7rem)] leading-none text-ink sm:py-4">{{ config.title }}</a>
    <div class="rule-oxford"></div>
  </header>

  <main class="mx-auto max-w-6xl px-4 pb-6">
    {% block content %}{% endblock %}
  </main>

  <footer class="mx-auto max-w-6xl px-4 pb-12">
    <div class="rule-oxford"></div>
    <p class="mx-auto max-w-2xl pt-4 text-center text-xs italic leading-relaxed text-muted">{{ trans(key="footer", lang=lang) }}</p>
  </footer>
</body>
</html>
