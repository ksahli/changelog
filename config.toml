# Overridden in CI with the GitHub Pages URL (zola build --base-url ...).
base_url = "https://example.github.io/changelog"
title = "Changelog"
description = "What changed in the world since yesterday"
default_language = "en"

compile_sass = false
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]
feed_limit = 30

[markdown]
smart_punctuation = true

[extra]
repo_url = ""
# Order of the header language switcher; the first one is served at the root.
languages = ["en", "fr", "de"]

# UI strings for the default language (English); French below.
# `{items}`, `{candidates}` and `{sources}` are substituted in templates;
# `{n}`, `{mine}`, `{total}` and `{high}` are substituted by static/js/edition.js;
# date_* values are UTS-35 patterns (localized via `locale`).
[translations]
locale = "en_US"
date_long = "EEEE, MMMM d, y"
date_short = "MMMM d"
date_day = "EEE d"
date_month = "MMMM y"
archive = "Archive"
feed = "Feed"
todays_edition = "Today's edition"
the_edition = "The edition"
stats = "{items} stories picked from {candidates} items across {sources} feeds"
in_brief = "In brief"
why_it_matters = "Why it matters —"
source = "source"
high = "High"
medium = "Medium"
low = "Low"
newer = "← Newer"
older = "Older →"
no_digest = "No digest yet. The first one will show up after the next morning run."
footer = "Generated each morning from public RSS feeds and summarized by Claude. Summaries can be wrong, so check the linked sources before you act on anything."
search = "Search"
search_placeholder = "Search this edition, or try #rce"
results = "{n} results"
no_results = "No stories match."
also_patch = "Also patch today"
for_your_stack = "For your stack"
everything_else = "Everything else"
past_editions = "Past editions"
your_stack = "Your stack"
your_stack_hint = "Follow the tags you care about. Saved in this browser only."
stack_summary = "{mine} of {total} stories touch your stack, {high} of them high priority."
stack_summary_empty = "Follow a few tags below to get a front page built for your stack."
in_your_stack = "in your stack"
top_story = "top story"
sources = "{n} sources"
source_one = "1 source"
save = "Save"
saved = "★ Saved"
mark_read = "Mark read"
read = "Read"

